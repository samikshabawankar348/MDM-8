
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe, #f3e8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    form {
      padding: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.2);
    }

    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 5px;
      display: block;
    }

    .success {
      color: #16a34a;
      background: #dcfce7;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.3);
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 500px) {
      form {
        padding: 22px;
      }

      .header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🎓 Student Registration</h1>
      <p>College Admission Portal</p>
    </div>

    <form id="registrationForm" novalidate>

      <div id="successMessage" class="success">
        Registration successful! Your form has been submitted.
      </div>

      <!-- Full Name -->
      <div class="input-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <span class="error" id="nameError"></span>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Email Address *</label>
        <input type="text" id="email" placeholder="example@gmail.com">
        <span class="error" id="emailError"></span>
      </div>

      <!-- Mobile -->
      <div class="input-group">
        <label for="mobile">Mobile Number *</label>
        <input type="text" id="mobile" placeholder="Enter 10-digit mobile number"
               maxlength="10" inputmode="numeric">
        <span class="error" id="mobileError"></span>
      </div>

      <!-- Course -->
      <div class="input-group">
        <label for="course">Select Course *</label>
        <select id="course">
          <option value="">-- Choose Course --</option>
          <option value="B.Tech">B.Tech</option>
          <option value="BCA">BCA</option>
          <option value="BBA">BBA</option>
          <option value="B.Sc">B.Sc</option>
          <option value="MCA">MCA</option>
        </select>
        <span class="error" id="courseError"></span>
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Password *</label>
        <input type="password" id="password"
               placeholder="Minimum 8 characters">
        <span class="error" id="passwordError"></span>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label for="confirmPassword">Confirm Password *</label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter your password">
        <span class="error" id="confirmPasswordError"></span>
      </div>

      <button type="submit">Register Now</button>

      <div class="footer">
        © 2026 College Admission Portal
      </div>

    </form>
  </div>

  <script>
    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      // Get input values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const course = document.getElementById("course").value;
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      // Clear previous errors
      document.querySelectorAll(".error").forEach(function(error) {
        error.textContent = "";
      });

      document.getElementById("successMessage").style.display = "none";

      let isValid = true;

      // Full name validation
      if (name === "") {
        document.getElementById("nameError").textContent =
          "Full name is required.";
        isValid = false;
      }

      // Email validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (email === "") {
        document.getElementById("emailError").textContent =
          "Email is required.";
        isValid = false;
      } else if (!emailPattern.test(email)) {
        document.getElementById("emailError").textContent =
          "Enter a valid email address.";
        isValid = false;
      }

      // Mobile number validation
      const mobilePattern = /^[6-9]\d{9}$/;

      if (mobile === "") {
        document.getElementById("mobileError").textContent =
          "Mobile number is required.";
        isValid = false;
      } else if (!mobilePattern.test(mobile)) {
        document.getElementById("mobileError").textContent =
          "Enter a valid 10-digit Indian mobile number.";
        isValid = false;
      }

      // Course validation
      if (course === "") {
        document.getElementById("courseError").textContent =
          "Please select a course.";
        isValid = false;
      }

      // Password validation
      if (password === "") {
        document.getElementById("passwordError").textContent =
          "Password is required.";
        isValid = false;
      } else if (password.length < 8) {
        document.getElementById("passwordError").textContent =
          "Password must contain at least 8 characters.";
        isValid = false;
      }

      // Confirm password validation
      if (confirmPassword === "") {
        document.getElementById("confirmPasswordError").textContent =
          "Please confirm your password.";
        isValid = false;
      } else if (password !== confirmPassword) {
        document.getElementById("confirmPasswordError").textContent =
          "Passwords do not match.";
        isValid = false;
      }

      // Final result
      if (isValid) {
        document.getElementById("successMessage").style.display = "block";

        // Demo only: no data is sent to a server.
        form.reset();
      }
    });
  </script>

</body>
</html>
